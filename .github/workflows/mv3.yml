name: Verify MV3

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mv3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CHROME_BIN: /usr/bin/google-chrome

jobs:
  verify:
    name: Verify MV3
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/chromium/runet-censorship-bypass/package-lock.json

      - name: Verify documentation integrity
        run: node ./scripts/verify-docs.mjs

      - name: Verify supply-chain policy
        env:
          SUPPLY_CHAIN_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node ./scripts/verify-supply-chain.mjs

      - name: Test supply-chain verifier
        run: node --test ./scripts/verify-supply-chain.test.mjs

      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          show-openssf-scorecard: false

      - name: Install extension dependencies
        run: npm ci --prefix ./extensions/chromium/runet-censorship-bypass

      - name: Verify registry signatures
        run: npm audit signatures --prefix ./extensions/chromium/runet-censorship-bypass

      - name: Audit production dependencies
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run audit:prod

      - name: Run PAC regression tests
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run test:pac

      - name: Run MV3 tests
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run test:mv3

      - name: Lint MV3
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run lint:mv3

      - name: Build MV3
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run build:mv3

      - name: Run Chrome Stable MV3 browser smoke
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run test:browser:mv3

      - name: Run aggregate verification
        run: npm --prefix ./extensions/chromium/runet-censorship-bypass run verify

      - name: Validate exact MV3 output
        run: |
          package_dir='./extensions/chromium/runet-censorship-bypass/build/extension-chromium-mv3'
          test -d "$package_dir"
          test -f "$package_dir/manifest.json"

      - name: Validate tracked-worktree integrity
        run: git diff --exit-code

      - name: Upload unpacked MV3 build
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runet-censorship-bypass-mv3-${{ github.sha }}
          path: extensions/chromium/runet-censorship-bypass/build/extension-chromium-mv3
          if-no-files-found: error
          retention-days: 7
