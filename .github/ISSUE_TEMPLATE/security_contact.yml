name: Запросить приватный security-канал
description: Публичный запрос контакта без деталей уязвимости или секретов
title: "[Security contact]: "
body:
  - type: markdown
    attributes:
      value: |
        Эта форма публична. Не описывайте уязвимость, способ эксплуатации, приватную конфигурацию или секреты. Здесь нужно только запросить безопасный канал связи.
  - type: input
    id: affected_version
    attributes:
      label: Публичная версия или commit
      description: Укажите только опубликованную версию или публичный commit без приватных деталей.
      placeholder: v0.0.2.0-beta1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Общая область
      options:
        - PAC source or validation
        - Proxy ownership or application
        - Credentials or authentication
        - Storage or migration
        - Extension UI or messaging
        - Другая область
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Подтверждение приватности
      options:
        - label: Я не добавил(а) детали уязвимости, exploit steps, passwords, proxy credentials/endpoints, tokens, cookies, private URLs/PAC, logs или browsing history.
          required: true
        - label: Я прошу сопровождающего предложить приватный канал для продолжения.
          required: true
